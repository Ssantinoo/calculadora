<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>
    <div class="container">

        <div class="result">
            0
        </div>

        <div class="keypad">
            <button class="btn clear-btn">C</button>
            <button class="btn delete-btn">⌫</button>
            <button class="btn divide-btn">÷</button>
            <button class="btn multiply-btn">×</button>

            <button class="btn number seven-btn">7</button>
            <button class="btn number eight-btn">8</button>
            <button class="btn number nine-btn">9</button>
            <button class="btn subtract-btn">-</button>

            <button class="btn number four-btn">4</button>
            <button class="btn number five-btn">5</button>
            <button class="btn number six-btn">6</button>
            <button class="btn add-btn">+</button>

            <button class="btn number one-btn">1</button>
            <button class="btn number two-btn">2</button>
            <button class="btn number three-btn">3</button>
            <button class="btn equal-btn">=</button>

            <button class="btn number zero-btn">0</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
